<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My Tasks</title>
    <meta name="description" content="A simple personal to-do list. Your tasks stay on this device." />
    <meta name="theme-color" content="#3B1FA3" />
    <script>
      /* Set the theme before first paint to avoid a flash. Keep in sync with src/lib/theme.js */
      ;(function () {
        try {
          var p = localStorage.getItem('my-tasks:theme')
          var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          var r = document.documentElement
          r.dataset.theme = dark ? 'dark' : 'light'
          r.style.colorScheme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#14112B' : '#3B1FA3')
        } catch (e) {}
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="My Tasks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
